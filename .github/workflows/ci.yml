name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    name: Swift build and tests
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test Swift package
        run: swift test --package-path streamer
      - name: Build Apple Silicon release
        run: swift build -c release --arch arm64 --package-path streamer

  runtime:
    name: OpenXR cross-build
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Install cross-build prerequisites
        run: brew install cmake mingw-w64
      - name: Configure runtime
        run: >-
          cmake -S runtime -B runtime/build-ci
          -DCMAKE_TOOLCHAIN_FILE=runtime/cmake/toolchains/mingw-x86_64.cmake
          -DCMAKE_BUILD_TYPE=Release
      - name: Build runtime and smoke executables
        run: cmake --build runtime/build-ci --parallel
      - name: Validate scripts and metadata
        run: |
          zsh -n packaging/*.zsh runtime/scripts/*.zsh
          plutil -lint packaging/Info.plist
